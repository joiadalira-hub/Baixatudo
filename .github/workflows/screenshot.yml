name: Print do app (emulador)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Baixar o APK publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R ${{ github.repository }} --pattern BaixaTudo-universal.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r BaixaTudo-universal.apk
            adb logcat -c
            adb shell monkey -p com.baixatudo.app -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > tela1.png
            adb shell input swipe 540 1900 540 500 500
            sleep 3
            adb exec-out screencap -p > tela2.png
            adb logcat -d -b crash > log.txt || true
            adb logcat -d | grep -iE "baixatudo|AndroidRuntime|FATAL" | tail -200 >> log.txt || true
      - name: Guardar os prints na ramificação "prints"
        run: |
          mkdir p && mv tela*.png log.txt p/ && cd p
          git init -q -b prints && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm prints
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prints
