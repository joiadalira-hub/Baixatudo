name: Print do app (emulador)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Execução do 'Gerar APK' de onde pegar o APK"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  shot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: |
            timeout 120 adb install -r out/BaixaTudo-universal.apk
            timeout 10 adb logcat -c || true
            timeout 30 adb shell am start -W -n com.baixatudo.app/.MainActivity || true
            sleep 8
            timeout 20 adb exec-out screencap -p > tela1.png || true
            sleep 10
            timeout 20 adb exec-out screencap -p > tela1b.png || true
            timeout 10 adb shell input swipe 540 1900 540 500 500 || true
            sleep 3
            timeout 20 adb exec-out screencap -p > tela2.png || true
            timeout 20 adb logcat -d > log.txt || true
      - name: Guardar
        if: always()
        run: |
          mkdir p && cp tela*.png log.txt p/ 2>/dev/null || true
          cd p && git init -q -b prints${{ matrix.api }} && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm prints
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prints${{ matrix.api }}
