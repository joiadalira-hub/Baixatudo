name: Gerar APK

on:
  push:
    paths:
      - "BaixaTudo.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar projeto
        run: unzip -o -q BaixaTudo.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: BaixaTudo
        run: gradle assembleDebug --no-daemon

      - name: Preparar arquivos
        run: |
          mkdir out
          cp BaixaTudo/app/build/outputs/apk/debug/*arm64-v8a*.apk out/BaixaTudo.apk
          cp BaixaTudo/app/build/outputs/apk/debug/*universal*.apk out/BaixaTudo-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/

  # Abre o app num celular virtual: se fechar sozinho, NÃO publica
  testar-e-publicar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out

      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Abrir o app no emulador
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          ram-size: 4096M
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            timeout 120 adb install -r out/BaixaTudo-universal.apk
            timeout 10 adb logcat -c || true
            timeout 30 adb shell monkey -p com.baixatudo.app -c android.intent.category.LAUNCHER 1 || true
            sleep 1
            timeout 20 adb exec-out screencap -p > abertura.png || true
            sleep 24
            timeout 20 adb exec-out screencap -p > tela1.png || true
            timeout 10 adb shell input swipe 540 1900 540 500 500 || true
            sleep 3
            timeout 20 adb exec-out screencap -p > tela2.png || true
            timeout 20 adb logcat -d -b crash > log.txt || true
            timeout 10 adb shell pidof com.baixatudo.app > pid.txt || true

      - name: Guardar prints na ramificação "prints"
        if: always()
        run: |
          mkdir p && cp tela*.png abertura.png log.txt p/ 2>/dev/null || true
          cd p && git init -q -b prints && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm prints
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prints

      - name: Conferir que o app não fechou
        run: |
          if grep -q "FATAL EXCEPTION" log.txt || [ ! -s pid.txt ]; then
            echo "O app fechou ao abrir:"; cat log.txt | head -60; exit 1
          fi
          echo "App abriu e continua rodando."

      - name: Publicar versão (link fixo para baixar no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" out/BaixaTudo.apk out/BaixaTudo-universal.apk \
            -R ${{ github.repository }} \
            --title "BaixaTudo (versão ${{ github.run_number }})" \
            --notes "Baixe o BaixaTudo.apk e instale. Para outros celulares Android antigos, use o BaixaTudo-universal.apk." \
            --latest
