name: Teste do corte (audio)

on:
  workflow_dispatch:
    inputs:
      url:
        default: "https://www.youtube.com/watch?v=aqz-KE-bpKQ"
      trecho:
        default: "120-420"

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Ferramentas
        run: |
          pip install -q -U "yt-dlp[default]"
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || true
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          yt-dlp --version; ffmpeg -version | head -1
      - name: Testes
        run: |
          U="${{ inputs.url }}"; T="${{ inputs.trecho }}"
          info() { for f in "$@"; do
            echo "== $f"; ffprobe -v error -show_entries stream=codec_type,duration:format=duration -of compact "$f"
            # volume da 2a metade do áudio
            D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            H=$(python3 -c "print(float('$D')/2)")
            echo -n "volume 1a metade: "; ffmpeg -v info -t $H -i "$f" -vn -af volumedetect -f null - 2>&1 | grep -o "mean_volume.*"
            echo -n "volume 2a metade: "; ffmpeg -v info -ss $H -i "$f" -vn -af volumedetect -f null - 2>&1 | grep -o "mean_volume.*"
          done; }
          set +e
          yt-dlp -q -o "a_atual.%(ext)s" --download-sections "*$T" --force-keyframes-at-cuts -f "bv*+ba/b" -S "res:720,vcodec:h264,acodec:m4a" --merge-output-format mp4 --remux-video mp4 "$U"
          yt-dlp -q -o "b_semforce.%(ext)s" --download-sections "*$T" -f "bv*+ba/b" -S "res:720,vcodec:h264,acodec:m4a" --merge-output-format mp4 --remux-video mp4 "$U"
          info a_atual.mp4 b_semforce.mp4
          ls -la
